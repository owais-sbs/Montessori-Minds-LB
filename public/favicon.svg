<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" stroke="#4a5a38" stroke-width="2.5" fill="#f7f4ec"/>

  <!-- Arch -->
  <path d="M14 52 L14 30 Q14 10 32 10 Q50 10 50 30 L50 52" stroke="#4a5a38" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left tree trunk -->
  <line x1="24" y1="52" x2="24" y2="33" stroke="#4a5a38" stroke-width="2" stroke-linecap="round"/>
  <!-- Left tree canopy -->
  <path d="M17 35 Q17 18 24 16 Q31 18 31 35" stroke="#4a5a38" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Left tree branch -->
  <line x1="24" y1="26" x2="19" y2="22" stroke="#4a5a38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="30" x2="29" y2="27" stroke="#4a5a38" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right small tree -->
  <line x1="36" y1="52" x2="36" y2="40" stroke="#4a5a38" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="36" cy="36" r="5" stroke="#4a5a38" stroke-width="1.8" fill="none"/>

  <!-- House -->
  <rect x="41" y="41" width="8" height="11" stroke="#4a5a38" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Roof -->
  <polyline points="39,42 45,35 51,42" stroke="#4a5a38" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Keyhole -->
  <circle cx="45" cy="45" r="2" stroke="#7a5c44" stroke-width="1.5" fill="none"/>
  <rect x="44" y="47" width="2" height="3" stroke="#7a5c44" stroke-width="1" fill="none"/>
</svg>
